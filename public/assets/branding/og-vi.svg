<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#220B03"/>
      <stop offset="35%" stop-color="#150602"/>
      <stop offset="70%" stop-color="#0E0401"/>
      <stop offset="100%" stop-color="#080201"/>
    </linearGradient>

    <!-- Warm Central Ambient Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.36"/>
      <stop offset="40%" stop-color="#EA580C" stop-opacity="0.14"/>
      <stop offset="75%" stop-color="#EA580C" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo Glow Aura -->
    <radialGradient id="logoHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB713B" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#EA580C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Frame Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FB923C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C2D12" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Subtle Tech Dot Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#EA580C" fill-opacity="0.10"/>
    </pattern>

    <!-- Logo Drop Shadow Filter -->
    <filter id="logoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#EA580C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#centerGlow)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- 2. Decorative Center Watermark Enso Zen Circle -->
  <g transform="translate(600, 315) scale(6.0) translate(-50, -50)" opacity="0.08">
    <path d="M 56.1 13.1 A 37.2 37.2 0 1 0 85.6 65.1" stroke="#EA580C" stroke-width="7" stroke-linecap="round"/>
    <circle cx="65.2" cy="28.3" r="6" fill="#FB923C"/>
    <circle cx="78.4" cy="48.1" r="6" fill="#FB923C"/>
  </g>

  <!-- 3. Outer Frame Border -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- ================= CENTERED LOGO & BRAND TEXT ================= -->
  <g>
    <!-- Logo Halo Glow -->
    <circle cx="600" cy="182" r="170" fill="url(#logoHalo)"/>

    <!-- Central Logo Box (136x136) -->
    <g transform="translate(532, 114)" filter="url(#logoShadow)">
      <rect width="136" height="136" rx="36" fill="#EA580C" stroke="#FDBA74" stroke-width="3"/>
      <!-- Inner Zen Enso Circle & 2 Dots -->
      <g transform="translate(13.5, 13.5) scale(1.09)">
        <path d="M 56.1 13.1 A 37.2 37.2 0 1 0 85.6 65.1" stroke="#FFFFFF" stroke-width="9.5" stroke-linecap="round"/>
        <circle cx="65.2" cy="28.3" r="8.2" fill="#FFF7ED"/>
        <circle cx="78.4" cy="48.1" r="8.2" fill="#FFF7ED"/>
      </g>
    </g>

    <!-- Main Brand Name: KD Labs -->
    <text x="600" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="86" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">KD Labs</text>

    <!-- Subtitle: KEEP DEVELOPMENT -->
    <text x="600" y="410" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#FB713B" letter-spacing="8.5">KEEP DEVELOPMENT</text>

    <!-- Clean Website URL with Status Indicator (Perfect Center Alignment) -->
    <g transform="translate(600, 482)">
      <!-- Centered pill container (180x42) -->
      <rect x="-90" y="-21" width="180" height="42" rx="21" fill="#180A04" stroke="#EA580C" stroke-width="1.2" stroke-opacity="0.6"/>
      <!-- Live Pulse Green Dot -->
      <circle cx="-50" cy="0" r="4.5" fill="#22C55E"/>
      <text x="-32" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#E7E5E4" letter-spacing="0.5">kd.io.vn</text>
    </g>
  </g>
</svg>